<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #04060f;
      --surface:  #090d1a;
      --cyan:     #00f5ff;
      --pink:     #ff006e;
      --yellow:   #f9e11e;
      --text:     #c8d6f0;
      --dim:      #3a4560;
      --glow-c:   0 0 8px #00f5ff, 0 0 24px #00f5ff55;
      --glow-p:   0 0 8px #ff006e, 0 0 24px #ff006e55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* ── scanline overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,245,255,.018) 2px,
        rgba(0,245,255,.018) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ── grid bg ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 28px;
      z-index: 1;
    }

    /* ── corner decorations ── */
    .corner {
      position: fixed;
      width: 60px; height: 60px;
      border-color: var(--cyan);
      border-style: solid;
      opacity: .5;
    }
    .corner--tl { top:16px; left:16px;  border-width: 2px 0 0 2px; }
    .corner--tr { top:16px; right:16px; border-width: 2px 2px 0 0; }
    .corner--bl { bottom:16px; left:16px;  border-width: 0 0 2px 2px; }
    .corner--br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

    /* ── slug badge ── */
    .slug-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(.7rem, 2vw, .9rem);
      letter-spacing: .2em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .slug-badge span { color: var(--cyan); text-shadow: var(--glow-c); }

    /* ── status / error ── */
    #status {
      font-size: 1rem;
      color: var(--dim);
      text-align: center;
      padding: 0 20px;
      animation: blink 1.4s infinite;
    }
    @keyframes blink { 50% { opacity: .35; } }

    .error-box {
      border: 1px solid var(--pink);
      padding: 18px 28px;
      text-align: center;
      color: var(--pink);
      text-shadow: var(--glow-p);
      font-family: 'Orbitron', sans-serif;
      font-size: .9rem;
      letter-spacing: .1em;
      animation: none;
    }
    .error-box small { display:block; margin-top:8px; color:var(--dim); font-family:'Share Tech Mono',monospace; font-size:.8rem; }

    /* ── PHOTO ── */
    #photo-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: min(90vw, 860px);
      max-height: 85vh;
      animation: fadeIn .5s ease;
    }
    #photo-wrap img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border: 1px solid var(--cyan);
      box-shadow: var(--glow-c);
    }

    /* ── VIDEO ── */
    #video-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(96vw, 900px);
      animation: fadeIn .5s ease;
    }
    #video-wrap video {
      width: 100%;
      border: 1px solid var(--cyan);
      box-shadow: var(--glow-c);
      background: #000;
    }

    /* ── AUDIO ── */
    #audio-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeIn .5s ease;
    }

    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 64px;
    }
    .waveform .bar {
      width: 5px;
      background: var(--cyan);
      border-radius: 3px 3px 0 0;
      box-shadow: 0 0 6px var(--cyan);
      transform-origin: bottom;
      animation: wave 1.1s ease-in-out infinite;
    }
    .waveform .bar:nth-child(2)  { animation-delay: .1s; }
    .waveform .bar:nth-child(3)  { animation-delay: .2s; }
    .waveform .bar:nth-child(4)  { animation-delay: .3s; }
    .waveform .bar:nth-child(5)  { animation-delay: .15s; }
    .waveform .bar:nth-child(6)  { animation-delay: .25s; }
    .waveform .bar:nth-child(7)  { animation-delay: .05s; }
    .waveform .bar:nth-child(8)  { animation-delay: .35s; }
    .waveform .bar:nth-child(9)  { animation-delay: .18s; }
    .waveform .bar:nth-child(10) { animation-delay: .28s; }

    @keyframes wave {
      0%,100% { height: 12px; }
      50%      { height: 56px; }
    }
    .waveform.paused .bar { animation-play-state: paused; }

    #play-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 40px;
      border: 2px solid var(--cyan);
      background: transparent;
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--glow-c), inset 0 0 24px rgba(0,245,255,.05);
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    #play-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--cyan);
      opacity: 0;
      transition: opacity .2s;
    }
    #play-btn:hover::before { opacity: .08; }
    #play-btn:active { transform: scale(.97); }
    #play-btn svg { flex-shrink: 0; position: relative; }
    #play-btn span { position: relative; }

    .progress-track {
      width: min(380px, 80vw);
      height: 4px;
      background: var(--dim);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--cyan);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--cyan);
      transition: width .1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      width: min(380px, 80vw);
      font-size: .78rem;
      color: var(--dim);
    }

    .file-label {
      font-size: .8rem;
      color: var(--dim);
      letter-spacing: .08em;
    }
    .file-label span { color: var(--yellow); }

    @keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: none; } }
  </style>
</head>
<body>
  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div id="app">
    <p id="status">// инициализация...</p>

    <!-- PHOTO -->
    <div id="photo-wrap">
      <div class="slug-badge">/<span id="photo-slug"></span></div>
      <img id="photo-img" src="" alt="media" />
      <div class="file-label">FILE: <span id="photo-name"></span></div>
    </div>

    <!-- VIDEO -->
    <div id="video-wrap">
      <div class="slug-badge">/<span id="video-slug"></span></div>
      <video id="video-el" controls autoplay playsinline></video>
      <div class="file-label">FILE: <span id="video-name"></span></div>
    </div>

    <!-- AUDIO -->
    <div id="audio-wrap">
      <div class="slug-badge">/<span id="audio-slug"></span></div>
      <div class="waveform paused" id="waveform">
        <div class="bar" style="height:20px"></div>
        <div class="bar" style="height:36px"></div>
        <div class="bar" style="height:28px"></div>
        <div class="bar" style="height:48px"></div>
        <div class="bar" style="height:22px"></div>
        <div class="bar" style="height:40px"></div>
        <div class="bar" style="height:30px"></div>
        <div class="bar" style="height:52px"></div>
        <div class="bar" style="height:18px"></div>
        <div class="bar" style="height:44px"></div>
      </div>
      <button id="play-btn">
        <svg id="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <span id="btn-label">PLAY</span>
      </button>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
      <div class="file-label">FILE: <span id="audio-name"></span></div>
      <audio id="audio-el"></audio>
    </div>
  </div>

  <script>
    const PAUSE_ICON = `<polygon points="6,4 10,4 10,20 6,20"/><polygon points="14,4 18,4 18,20 14,20"/>`;
    const PLAY_ICON  = `<polygon points="5,3 19,12 5,21"/>`;

    function getSlug() {
      // works both on site.com/slug and via ?p=slug fallback
      const params = new URLSearchParams(location.search);
      if (params.get('p')) return params.get('p');
      const path = location.pathname.replace(/^\//, '').replace(/\/$/, '');
      return path || null;
    }

    function ext(filename) {
      return filename.split('.').pop().toLowerCase();
    }

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      return `${m}:${s}`;
    }

    function showError(msg, sub = '') {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="error-box">
          ⚠ ${msg}
          ${sub ? `<small>${sub}</small>` : ''}
        </div>`;
    }

    async function init() {
      const slug = getSlug();
      if (!slug) { showError('NO SLUG PROVIDED', 'Используй формат: site.com/название'); return; }

      document.getElementById('status').textContent = `// загрузка db.json...`;

      let db;
      try {
        const r = await fetch('./db.json?_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        db = await r.json();
      } catch (e) {
        showError('DB.JSON NOT FOUND', e.message);
        return;
      }

      const filename = db[slug];
      if (!filename) { showError(`SLUG NOT FOUND: "${slug}"`, 'Файл не зарегистрирован в базе'); return; }

      const filePath = `./mys/${filename}`;
      const type = ext(filename);
      document.getElementById('status').style.display = 'none';

      // ── IMAGE ──────────────────────────────────────────────
      if (['jpg','jpeg','png','gif','webp','svg'].includes(type)) {
        const w = document.getElementById('photo-wrap');
        document.getElementById('photo-slug').textContent = slug;
        document.getElementById('photo-img').src = filePath;
        document.getElementById('photo-name').textContent = filename;
        w.style.display = 'flex';

      // ── VIDEO ──────────────────────────────────────────────
      } else if (['mp4','webm','ogg','mov'].includes(type)) {
        const w = document.getElementById('video-wrap');
        document.getElementById('video-slug').textContent = slug;
        const vid = document.getElementById('video-el');
        vid.src = filePath;
        document.getElementById('video-name').textContent = filename;
        w.style.display = 'flex';

      // ── AUDIO ──────────────────────────────────────────────
      } else if (['mp3','wav','ogg','m4a','flac','aac'].includes(type)) {
        const w   = document.getElementById('audio-wrap');
        const aud = document.getElementById('audio-el');
        const btn = document.getElementById('play-btn');
        const icon= document.getElementById('btn-icon');
        const lbl = document.getElementById('btn-label');
        const wf  = document.getElementById('waveform');
        const pf  = document.getElementById('progress-fill');
        const pt  = document.getElementById('progress-track');

        document.getElementById('audio-slug').textContent = slug;
        aud.src = filePath;
        document.getElementById('audio-name').textContent = filename;
        w.style.display = 'flex';

        aud.addEventListener('loadedmetadata', () => {
          document.getElementById('time-dur').textContent = formatTime(aud.duration);
        });
        aud.addEventListener('timeupdate', () => {
          document.getElementById('time-cur').textContent = formatTime(aud.currentTime);
          if (aud.duration) pf.style.width = (aud.currentTime / aud.duration * 100) + '%';
        });
        aud.addEventListener('ended', () => {
          icon.innerHTML = PLAY_ICON; lbl.textContent = 'PLAY';
          wf.classList.add('paused');
        });

        btn.addEventListener('click', () => {
          if (aud.paused) {
            aud.play();
            icon.innerHTML = PAUSE_ICON; lbl.textContent = 'PAUSE';
            wf.classList.remove('paused');
          } else {
            aud.pause();
            icon.innerHTML = PLAY_ICON; lbl.textContent = 'PLAY';
            wf.classList.add('paused');
          }
        });

        pt.addEventListener('click', e => {
          const ratio = e.offsetX / pt.offsetWidth;
          aud.currentTime = ratio * aud.duration;
        });

      } else {
        showError(`UNSUPPORTED FORMAT: .${type}`, filename);
      }
    }

    init();
  </script>
</body>
</html>
